[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-agent"
version = "0.1.0"
description = "通过本地 DeepSeek Harness 运行社会平台 agent 并导出会话日志"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.23,<1", "filelock>=3.16,<4"]

[project.scripts]
social-agent = "social_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["social_agent*"]
